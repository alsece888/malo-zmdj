<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卡组管理 - 正面对决大本营</title>
  <!-- busuanzi PV/UV counter -->
  <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
  <!-- Cloudflare Web Analytics -->
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "f4f8bb9091bb4c26b0243c4cc6ff582a"}'></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    :root {
      --primary: #4f46e5; --primary-light: #e0e7ff; --primary-dark: #4338ca;
      --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
      --bg: #f8fafc; --bg-1: #ffffff; --bg-2: #f1f5f9; --bg-3: #e2e8f0;
      --text: #0f172a; --text-2: #475569; --text-3: #94a3b8;
      --border: #e2e8f0; --radius: 14px; --shadow: 0 4px 20px rgba(15,23,42,.06);
      --shadow-lg: 0 12px 32px rgba(15,23,42,.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
    }
    a { color: var(--primary); text-decoration: none; }

    .top-header {
      background: var(--bg-1); border-bottom: 1px solid var(--border);
      padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 18px; }
    .brand-logo {
      width: 38px; height: 38px; border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), #818cf8);
      display: grid; place-items: center; color: #fff; font-size: 18px;
    }
    .nav-links { display: flex; gap: 8px; }
    .nav-link { padding: 8px 14px; border-radius: 8px; color: var(--text-2); font-size: 14px; font-weight: 500; transition: .2s; }
    .nav-link:hover { background: var(--bg-2); color: var(--text); }
    .nav-link.active { background: var(--primary-light); color: var(--primary-dark); }

    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

    .page-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;
    }
    .page-title { font-size: 24px; font-weight: 800; margin: 0; }
    .page-subtitle { font-size: 14px; color: var(--text-3); margin: 4px 0 0; }

    .btn {
      padding: 10px 18px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: .2s; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: var(--bg-2); color: var(--text-2); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--bg-3); }
    .btn-danger { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
    .btn-danger:hover { background: #fee2e2; }
    .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }

    .deck-list { display: flex; flex-direction: column; gap: 14px; }

    .deck-card {
      background: var(--bg-1); border-radius: var(--radius); box-shadow: var(--shadow);
      overflow: hidden; transition: .2s;
    }
    .deck-card:hover { box-shadow: var(--shadow-lg); }

    .deck-card-header {
      padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border); cursor: pointer;
    }
    .deck-card-header:hover { background: var(--bg-2); }
    .deck-card-title { font-size: 17px; font-weight: 700; }
    .deck-card-meta { font-size: 13px; color: var(--text-3); margin-top: 2px; }

    .deck-card-body { padding: 16px 20px; display: none; }
    .deck-card-body.open { display: block; }

    .deck-preview { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .deck-preview-card {
      width: 64px; height: 90px; border-radius: 6px; overflow: hidden; position: relative;
      background: var(--bg-2); flex-shrink: 0;
    }
    .deck-preview-card img { width: 100%; height: 100%; object-fit: cover; }
    .deck-preview-card .qty {
      position: absolute; top: 2px; right: 2px;
      min-width: 16px; height: 16px; border-radius: 8px;
      background: rgba(0,0,0,.75); color: #fff; font-size: 9px; font-weight: 700;
      display: grid; place-items: center; padding: 0 3px;
    }
    .deck-preview-commander {
      width: 80px; height: 112px; border: 2px solid #f59e0b; border-radius: 8px;
    }

    .deck-stats-row {
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .deck-stat {
      background: var(--bg-2); border-radius: 10px; padding: 10px 14px; text-align: center;
      min-width: 70px;
    }
    .deck-stat-val { font-size: 18px; font-weight: 800; color: var(--primary); }
    .deck-stat-label { font-size: 11px; color: var(--text-3); margin-top: 2px; }

    .deck-actions-row { display: flex; gap: 8px; margin-top: 14px; }

    .empty-state {
      text-align: center; padding: 60px 20px; color: var(--text-3);
    }
    .empty-state h3 { font-size: 20px; margin-bottom: 8px; color: var(--text-2); }
    .empty-state p { font-size: 14px; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #1e293b; color: #fff; padding: 12px 20px; border-radius: 10px;
      font-size: 14px; opacity: 0; pointer-events: none; transition: .3s; z-index: 300;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Confirm dialog */
    .confirm-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.4);
      display: flex; align-items: center; justify-content: center; z-index: 200;
    }
    .confirm-box {
      background: #fff; border-radius: 14px; padding: 24px; max-width: 400px; width: 90%;
      box-shadow: var(--shadow-lg); text-align: center;
    }
    .confirm-box h3 { margin: 0 0 8px; font-size: 16px; }
    .confirm-box p { font-size: 14px; color: var(--text-2); margin: 0 0 20px; }
    .confirm-box .btn-row { display: flex; gap: 10px; justify-content: center; }

    /* ===== FOOTER ===== */
    .site-footer {
      background: var(--bg-1);
      border-top: 1px solid var(--border);
      padding: 18px 28px;
      margin-top: 48px;
    }
    .footer-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12px;
      color: var(--text-3);
    }
    .footer-inner .footer-brand { font-weight: 600; color: var(--text-2); }
    #busuanzi_container { font-size: 12px; }
    #busuanzi_container span { color: var(--primary); font-weight: 600; }
    #busuanzi_value_site_pv:empty::after,
    #busuanzi_value_site_uv:empty::after { content: '--'; color: var(--text-3); font-weight: 400; }
    @media (max-width: 640px) {
      .footer-inner { flex-direction: column; gap: 4px; text-align: center; }
    }
  </style>
</head>
<body>
  <header class="top-header">
    <a href="index.html" class="brand">
      <div class="brand-logo">正</div>
      <div>正面对决大本营</div>
    </a>
    <nav class="nav-links">
      <a class="nav-link" href="index.html">首页</a>
      <a class="nav-link" href="deck-builder.html">组卡器</a>
      <a class="nav-link active" href="deck-manager.html">卡组管理</a>
    </nav>
  </header>

  <div class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title">卡组管理</h1>
        <p class="page-subtitle" id="deck-count-info">已保存 0 个卡组</p>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-secondary" onclick="exportAllDecks()">导出全部</button>
        <a class="btn btn-primary" href="deck-builder.html">新建卡组</a>
      </div>
    </div>

    <div class="deck-list" id="deck-list"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="cards_data.js"></script>
  <script>
    const DECK_STORAGE_KEY = 'zmdj_saved_decks';
    const cardMap = new Map((window.CARD_DATA && window.CARD_DATA.cards || []).map(c => [c.id, c]));

    function getCard(id) { return cardMap.get(id); }
    function imgUrl(card) {
      if (!card) return '';
      if (card.imageUrl && card.imageUrl.startsWith('http')) return card.imageUrl;
      if (card.localImage) return card.localImage;
      return card.imageUrl || '';
    }

    function getTypeLabel(t) {
      const m = { commander: '统帅', unit: '角色', spell: '锦囊', attachment: '附属', strategy: '兵法' };
      return m[t] || t;
    }

    function getAttrColor(a) {
      const m = { '风': '#059669', '林': '#16a34a', '火': '#dc2626', '山': '#a16207', '阴': '#6366f1', '雷': '#7c3aed' };
      return m[a] || '#9ca3af';
    }

    function getDecks() {
      try { return JSON.parse(localStorage.getItem(DECK_STORAGE_KEY) || '[]'); }
      catch (e) { return []; }
    }

    function saveDecks(decks) {
      localStorage.setItem(DECK_STORAGE_KEY, JSON.stringify(decks));
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    function render() {
      const decks = getDecks();
      document.getElementById('deck-count-info').textContent = '已保存 ' + decks.length + ' 个卡组';
      const list = document.getElementById('deck-list');

      if (decks.length === 0) {
        list.innerHTML = '<div class="empty-state"><h3>还没有保存的卡组</h3><p>去 <a href="deck-builder.html">组卡器</a> 创建你的第一个卡组吧</p></div>';
        return;
      }

      list.innerHTML = decks.map((d, idx) => {
        const mainCount = (d.main || []).reduce((s, i) => s + i.count, 0);
        const runeCount = (d.runes || []).reduce((s, i) => s + i.count, 0);
        const totalCards = (d.commander ? 1 : 0) + mainCount + runeCount;
        const dateStr = d.updatedAt ? new Date(d.updatedAt).toLocaleString() : '未保存';

        // Commander preview
        let cmdHtml = '';
        if (d.commander) {
          const cmd = getCard(d.commander.cardId);
          if (cmd) cmdHtml = '<div class="deck-preview-card deck-preview-commander" title="' + cmd.name + '"><img src="' + imgUrl(cmd) + '" alt="' + cmd.name + '"></div>';
        }

        // Main deck preview (first 8)
        const mainPrev = (d.main || []).slice(0, 8).map(i => {
          const c = getCard(i.cardId);
          if (!c) return '';
          return '<div class="deck-preview-card"><img src="' + imgUrl(c) + '" alt="' + c.name + '"><div class="qty">×' + i.count + '</div></div>';
        }).join('');

        // Rune preview (first 4)
        const runePrev = (d.runes || []).slice(0, 4).map(i => {
          const c = getCard(i.cardId);
          if (!c) return '';
          return '<div class="deck-preview-card"><img src="' + imgUrl(c) + '" alt="' + c.name + '"><div class="qty">×' + i.count + '</div></div>';
        }).join('');

        // Unique types
        const allTypes = new Set();
        d.main && d.main.forEach(i => { const c = getCard(i.cardId); if (c) allTypes.add(getTypeLabel(c.type)); });
        d.runes && d.runes.forEach(i => { const c = getCard(i.cardId); if (c) allTypes.add(getTypeLabel(c.type)); });

        return '<div class="deck-card" id="deck-' + idx + '">' +
          '<div class="deck-card-header" onclick="toggleDeck(' + idx + ')">' +
            '<div>' +
              '<div class="deck-card-title">' + (d.name || '未命名卡组') + (d.commander ? ' <span style="font-size:12px;color:#f59e0b;font-weight:500">· ' + (getCard(d.commander.cardId) ? getCard(d.commander.cardId).name : '?') + '</span>' : '') + '</div>' +
              '<div class="deck-card-meta">' + dateStr + ' · ' + totalCards + '张 · ' + [...allTypes].join('/') + '</div>' +
            '</div>' +
            '<span style="font-size:20px;color:var(--text-3);transition:.2s" id="arrow-' + idx + '">▸</span>' +
          '</div>' +
          '<div class="deck-card-body" id="body-' + idx + '">' +
            '<div style="display:flex;gap:16px;flex-wrap:wrap">' +
              '<div style="flex:1;min-width:200px">' +
                (cmdHtml ? '<div style="margin-bottom:10px"><div style="font-size:11px;font-weight:700;color:var(--text-3);margin-bottom:4px">统帅</div>' + cmdHtml + '</div>' : '') +
                '<div style="margin-bottom:10px"><div style="font-size:11px;font-weight:700;color:var(--text-3);margin-bottom:4px">主牌库 (' + mainCount + '张)</div><div class="deck-preview">' + (mainPrev || '<span style="font-size:12px;color:var(--text-3)">无</span>') + '</div></div>' +
                '<div><div style="font-size:11px;font-weight:700;color:var(--text-3);margin-bottom:4px">兵法牌库 (' + runeCount + '张)</div><div class="deck-preview">' + (runePrev || '<span style="font-size:12px;color:var(--text-3)">无</span>') + '</div></div>' +
              '</div>' +
              '<div style="flex:0 0 auto">' +
                '<div class="deck-stats-row" style="flex-direction:column">' +
                  '<div class="deck-stat"><div class="deck-stat-val">' + (d.commander ? 1 : 0) + '</div><div class="deck-stat-label">统帅</div></div>' +
                  '<div class="deck-stat"><div class="deck-stat-val">' + mainCount + '</div><div class="deck-stat-label">主牌</div></div>' +
                  '<div class="deck-stat"><div class="deck-stat-val">' + runeCount + '</div><div class="deck-stat-label">兵法</div></div>' +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div class="deck-actions-row">' +
              '<button class="btn btn-sm btn-primary" onclick="loadDeck(\'' + d.id + '\')">编辑</button>' +
              '<button class="btn btn-sm btn-secondary" onclick="renameDeck(' + idx + ')">重命名</button>' +
              '<button class="btn btn-sm btn-secondary" onclick="exportDeckImageByIndex(' + idx + ')">导出图片</button>' +
              '<button class="btn btn-sm btn-secondary" onclick="copyDeckCode(' + idx + ')">复制代码</button>' +
              '<button class="btn btn-sm btn-danger" onclick="confirmDelete(' + idx + ')">删除</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function toggleDeck(idx) {
      const body = document.getElementById('body-' + idx);
      const arrow = document.getElementById('arrow-' + idx);
      if (!body || !arrow) return;
      const isOpen = body.classList.contains('open');
      body.classList.toggle('open', !isOpen);
      arrow.textContent = isOpen ? '▸' : '▾';
      arrow.style.transform = isOpen ? '' : 'rotate(0deg)';
    }

    function loadDeck(id) {
      const decks = getDecks();
      const d = decks.find(x => x.id === id);
      if (!d) return;
      // Write to current deck and navigate
      localStorage.setItem('zmdj_current_deck', JSON.stringify(d));
      window.location.href = 'deck-builder.html';
    }

    function deleteDeck(idx) {
      const decks = getDecks();
      decks.splice(idx, 1);
      saveDecks(decks);
      render();
      showToast('卡组已删除');
    }

    function renameDeck(idx) {
      const decks = getDecks();
      const d = decks[idx];
      if (!d) return;
      const newName = prompt('请输入新名称：', d.name || '未命名卡组');
      if (newName === null || newName.trim() === '') return;
      d.name = newName.trim();
      d.updatedAt = Date.now();
      decks[idx] = d;
      saveDecks(decks);
      render();
      showToast('卡组已重命名');
    }

    let confirmCallback = null;
    function confirmDelete(idx) {
      const decks = getDecks();
      const d = decks[idx];
      if (!d) return;
      if (!confirm('确定要删除卡组「' + (d.name || '未命名') + '」吗？此操作不可撤销。')) return;
      deleteDeck(idx);
    }

    function copyDeckCode(idx) {
      const decks = getDecks();
      const d = decks[idx];
      if (!d) return;
      navigator.clipboard.writeText(JSON.stringify(d, null, 2)).then(() => showToast('卡组代码已复制'));
    }

    async function exportDeckImageByIndex(idx) {
      const decks = getDecks();
      const d = decks[idx];
      if (!d) return;

      showToast('正在生成卡组图片...');

      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:fixed;left:-9999px;top:0;z-index:-1;background:#1a1a2e;padding:24px;border-radius:16px;display:inline-block;min-width:700px';
      document.body.appendChild(wrap);

      let html = '<div style="text-align:center;color:#fff;margin-bottom:16px"><h3 style="margin:0;font-size:20px">' + (d.name || '未命名卡组') + '</h3><p style="margin:4px 0 0;font-size:12px;opacity:.6">正面对决大本营 · malo-zmdj.cn</p></div>';

      if (d.commander) {
        const cmd = getCard(d.commander.cardId);
        if (cmd) html += '<div style="text-align:center;margin-bottom:12px"><img src="' + imgUrl(cmd) + '" style="width:140px;border-radius:10px" crossorigin="anonymous"></div>';
      }

      const mainCount = (d.main || []).reduce((s, i) => s + i.count, 0);
      html += '<div style="color:#fff;font-size:13px;font-weight:700;margin:14px 0 8px;opacity:.8">主牌库 <span style="font-size:11px;opacity:.5">' + mainCount + '张</span></div>';
      html += '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:600px">';
      for (const item of (d.main || [])) {
        const c = getCard(item.cardId);
        if (!c) continue;
        for (let i = 0; i < item.count; i++) {
          html += '<div style="position:relative;border-radius:6px;overflow:hidden;aspect-ratio:63/88"><img src="' + imgUrl(c) + '" style="width:100%;height:100%;object-fit:cover" crossorigin="anonymous"></div>';
        }
      }
      html += '</div>';

      const runeCount = (d.runes || []).reduce((s, i) => s + i.count, 0);
      if (runeCount > 0) {
        html += '<div style="color:#fff;font-size:13px;font-weight:700;margin:14px 0 8px;opacity:.8">兵法牌库 <span style="font-size:11px;opacity:.5">' + runeCount + '张</span></div>';
        html += '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:600px">';
        for (const item of (d.runes || [])) {
          const c = getCard(item.cardId);
          if (!c) continue;
          for (let i = 0; i < item.count; i++) {
            html += '<div style="position:relative;border-radius:6px;overflow:hidden;aspect-ratio:63/88"><img src="' + imgUrl(c) + '" style="width:100%;height:100%;object-fit:cover" crossorigin="anonymous"></div>';
          }
        }
        html += '</div>';
      }

      // Cost curve
      const costMap = {};
      let maxCV = 0, maxCC = 0;
      for (const item of (d.main || [])) {
        const c = getCard(item.cardId);
        if (!c || c.type === 'commander') continue;
        const cost = typeof c.cost === 'number' ? c.cost : 0;
        costMap[cost] = (costMap[cost] || 0) + item.count;
        if (cost > maxCV) maxCV = cost;
        if (costMap[cost] > maxCC) maxCC = costMap[cost];
      }
      html += '<div style="color:#fff;font-size:13px;font-weight:700;margin:14px 0 8px;opacity:.8">费用曲线</div>';
      html += '<div style="display:flex;align-items:flex-end;gap:4px;height:100px;padding:8px;background:rgba(255,255,255,.05);border-radius:10px">';
      for (let k = 0; k <= Math.max(8, maxCV); k++) {
        const v = costMap[k] || 0;
        const h = maxCC > 0 ? Math.max(4, Math.round(v / maxCC * 100)) : 4;
        const color = k <= 2 ? '#10b981' : k <= 4 ? '#f59e0b' : k <= 6 ? '#ef4444' : '#8b5cf6';
        html += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">' +
          '<div style="font-size:10px;color:#fff;opacity:.9;margin-bottom:2px">' + (v || '') + '</div>' +
          '<div style="width:100%;height:' + h + 'px;background:' + color + ';border-radius:3px 3px 0 0;min-height:' + (v > 0 ? 4 : 0) + 'px"></div>' +
          '<div style="font-size:9px;color:#fff;opacity:.5;margin-top:4px">' + k + '</div>' +
          '</div>';
      }
      html += '</div>';

      wrap.innerHTML = html;

      const imgs = wrap.querySelectorAll('img');
      await Promise.all(Array.from(imgs).map(img => new Promise(resolve => {
        if (img.complete && img.naturalWidth > 0) resolve();
        else { img.onload = resolve; img.onerror = resolve; }
      })));
      await new Promise(r => setTimeout(r, 300));

      try {
        const canvas = await html2canvas(wrap, { backgroundColor: '#1a1a2e', scale: 2, useCORS: true, allowTaint: true });
        const link = document.createElement('a');
        link.download = (d.name || '卡组') + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('卡组图片已导出');
      } catch (e) {
        showToast('导出图片失败');
      }
      document.body.removeChild(wrap);
    }

    function exportAllDecks() {
      const decks = getDecks();
      if (decks.length === 0) { showToast('没有卡组可导出'); return; }
      const blob = new Blob([JSON.stringify(decks, null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      link.download = '卡组备份_' + new Date().toISOString().slice(0,10) + '.json';
      link.href = URL.createObjectURL(blob);
      link.click();
      showToast('全部卡组已导出');
    }

    render();
  </script>
